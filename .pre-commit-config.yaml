repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      # Run the linter.
      - id: ruff-check
        files: ^(src/nyaml|tests)/.*\.py$
      - id: ruff-format
        files: ^(src/nyaml|tests)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy  # static type checking
        # Pre-commit runs mypy in an isolated virtualenv.
        # Disable filename passing to the venv explicit, so the hook checks
        # in the same scope as local `mypy src/nyaml tests`.
        pass_filenames: false
        args:
          - --config-file=pyproject.toml
          - src/nyaml
          - tests

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]  # modernizes syntax for Python 3.10+

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.0
    hooks:
      - id: cspell  # spellchecking
        pass_filenames: false
        args:
          # - --unique
          - --config
          - cspell.json
          - README.md
          - CITATION.cff
          - docs/**/*.md
          - docs/**/*.bib
          - src/nyaml/**/*.py
          - tests/**/*.py
