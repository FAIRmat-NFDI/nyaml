\category: application
\doc: |
  documentation no. 0
\symbols:
  \doc: |
    documentation no. 1
  testnamesymbol: |
    test description of symbol
\type: group
NXellipsometry_base_draft(my_test_extends):
  (NXentry):
    \doc: |
      documentation no. 2
    \@entry:
      \doc: |
        attribute documentation
    experiment_identifier:
      \exists: ['min', '3', 'max', '100']
      \doc: |
        documentation no. 3
    experiment_description:
      \exists: optional
    start_time(NX_DATE_TIME):
      \exists: optional
      \unit: NX_TIME
    program_name:
      \doc: |
        documentation no. 4
    program_version:
      \exists: ['min', '5']
      \doc: |
        documentation no. 5
    time_zone(NX_DATE_TIME):
      \exists: optional
      \doc: |
        documentation no. 6
    definition_local:
      \exists: ['max', '5']
      \doc: |
        documentation no. 7
      \@version:
    calibration_data(NX_NUMBER):
      \unit: NX_UNITLESS
      \doc: |
        Calibration is performed on a reference surface (usually silicon wafer with well
        defined oxide layer) at a number of angles, then in a straight through mode
        (transmission in air).

